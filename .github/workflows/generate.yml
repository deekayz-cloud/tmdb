name: Generate TMDB Backgrounds

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

env:
  TMDB_BEARER_TOKEN: ${{ secrets.TMDB_BEARER_TOKEN }}
  TMDB_BASE_URL: https://api.themoviedb.org/3
  TMDB_LANGUAGE: de-DE
  OUTPUT_ROOT: docs
  SITE_BASE_URL: https://deekayz-cloud.github.io/tmdb

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - run: pip install -r requirements.txt

      - run: python scripts/tmdb_plain.py
      - run: python scripts/tmdb_color.py
      - run: python scripts/combine_overflight.py
      - run: cp site/index.html docs/index.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
